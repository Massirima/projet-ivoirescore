<svg viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for basketball -->
    <radialGradient id="jcaBall" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F6C562"/>
      <stop offset="60%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#C2821A"/>
    </radialGradient>
    <!-- Drop shadow -->
    <filter id="jcaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Crest Outer Shape / Shield -->
  <g filter="url(#jcaShadow)">
    <!-- Outer Shield with Silver/Grey Border -->
    <path d="M100 8 C145 8 165 30 190 48 L172 128 L184 135 L184 190 L160 198 L100 234 L40 198 L16 190 L16 135 L28 128 L10 48 C35 30 55 8 100 8 Z" fill="#142036" stroke="#94A3B8" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Inner Shield Body -->
    <path d="M100 13 C142 13 161 33 184 50 L168 126 L178 133 L178 186 L156 194 L100 228 L44 194 L22 186 L22 133 L32 126 L16 50 C39 33 58 13 100 13 Z" fill="#16223B"/>

    <!-- Top White Arc Segment with Abidjan Skyline -->
    <clipPath id="topArchClip">
      <path d="M40 54 C40 24 67 18 100 18 C133 18 160 24 160 54 L160 55 L40 55 Z"/>
    </clipPath>

    <g clip-path="url(#topArchClip)">
      <!-- White Arch Background -->
      <rect x="35" y="15" width="130" height="42" fill="#FFFFFF"/>

      <!-- Abidjan Skyline in Navy Silhouette: Cocody Cable Bridge + Plateau Towers -->
      <!-- Bridge Cable Tower & Stay Lines -->
      <path d="M96 23 L98 42 L94 42 Z" fill="#142036"/>
      <line x1="96" y1="25" x2="80" y2="42" stroke="#142036" stroke-width="1.2"/>
      <line x1="96" y1="27" x2="84" y2="42" stroke="#142036" stroke-width="1.2"/>
      <line x1="96" y1="30" x2="88" y2="42" stroke="#142036" stroke-width="1.2"/>
      <line x1="96" y1="25" x2="112" y2="42" stroke="#142036" stroke-width="1.2"/>
      <line x1="96" y1="27" x2="108" y2="42" stroke="#142036" stroke-width="1.2"/>
      <line x1="96" y1="30" x2="104" y2="42" stroke="#142036" stroke-width="1.2"/>

      <!-- Skyline Buildings -->
      <rect x="46" y="34" width="7" height="18" fill="#142036"/>
      <polygon points="58,28 66,42 58,42" fill="#142036"/>
      <rect x="74" y="20" width="8" height="22" fill="#142036"/>
      <rect x="120" y="26" width="9" height="16" fill="#142036"/>
      <rect x="135" y="32" width="7" height="10" fill="#142036"/>
      <polygon points="144,30 148,42 142,42" fill="#142036"/>
    </g>

    <!-- Golden Basketball -->
    <circle cx="100" cy="85" r="32" fill="url(#jcaBall)" stroke="#142036" stroke-width="3"/>
    <!-- Basketball curved seams in navy -->
    <path d="M100 53 L100 117" stroke="#142036" stroke-width="2.5"/>
    <path d="M68 85 L132 85" stroke="#142036" stroke-width="2.5"/>
    <path d="M78 63 C90 73 90 97 78 107" stroke="#142036" stroke-width="2.5" fill="none"/>
    <path d="M122 63 C110 73 110 97 122 107" stroke="#142036" stroke-width="2.5" fill="none"/>

    <!-- Middle Cutout / Ribbon for "JCA" -->
    <!-- Bold Faceted White JCA letters with slight 3D angle -->
    <g>
      <!-- J -->
      <path d="M54 130 L66 130 L66 162 C66 172 58 176 48 176 C40 176 34 172 32 165 L43 162 C44 165 46 167 49 167 C53 167 55 165 55 160 L55 130 Z" fill="#FFFFFF"/>
      
      <!-- C -->
      <path d="M100 134 C86 134 76 142 76 153 C76 164 86 172 100 172 C108 172 115 169 119 164 L109 157 C107 160 104 162 100 162 C94 162 88 158 88 153 C88 148 94 144 100 144 C104 144 107 146 109 149 L119 142 C115 137 108 134 100 134 Z" fill="#FFFFFF"/>
      
      <!-- A -->
      <path d="M142 129 L156 129 L168 175 L155 175 L152 162 L136 162 L133 175 L121 175 L133 129 Z M144 140 L138 153 L149 153 Z" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Golden Text Banner: JEUNESSE CLUB D'ABIDJAN -->
    <text x="100" y="206" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="11" letter-spacing="1.2" fill="#E5A93C">
      JEUNESSE CLUB D'ABIDJAN
    </text>
  </g>
</svg>
